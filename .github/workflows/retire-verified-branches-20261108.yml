# One-time guarded branch retirement: exact branch SHAs and merged PR evidence.
# Only main can execute; stop safely if the repository or any branch changes.
name: Retire verified Case Study branches (2026-11-08)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retire-verified-branches-20261108.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: verified-branch-retirement-20261108
  cancel-in-progress: false

jobs:
  preserve-and-retire:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Archive all exact tips before deleting any branch ref
        shell: bash
        run: |
          set -euo pipefail
          api="repos/${GITHUB_REPOSITORY}"
          current_main="$(gh api "$api/git/ref/heads/main" --jq .object.sha)"
          [[ "$current_main" == "$GITHUB_SHA" ]] || { echo "::error::main moved"; exit 1; }

          # Every entry: original branch | exact SHA | merged PR number.
          # The ANCESTOR exception must still be provably contained by main.
          entries=(
            'chore/main-inventory-doc-sync-20261108|9db4858573cc23c892361e1a720d8c9668d7d313|63'
            'copy/concise-cross-asset-20261108|be553d1ce01426b594f64a59fe2f7d7b044840bb|52'
            'copy/concise-hidden-chapters-20261108|98c5a64eaae871e845101151d6c677f3b3e49fb0|46'
            'design/investment-visual-hierarchy-20261108|dee4bf493ecf4aa9456872723da34bfa06d3c637|42'
            'docs/prd-product-planning-kuse-20261108|a33763da2c7c088c6a9915acab7c33bd1656f839|51'
            'docs/prd-qa-trace-20261108|1199f01fd46ecd1a4aae56f6cdd4e50af9b219bd|47'
            'docs/sync-enforced-pr-rules-20261108|30a36ac351adeb99072c3f6127807bb7078ccc93|65'
            'feat/mosigo-prd-delivery-20261108|02f55692fb1c878ad558c412a9f2189b7b8c485f|43'
            'fix/keyboard-scroll-tables-20261108|34d0e88b1b735c0ceefb01d694e776c7870a4e45|54'
            'fix/mosigo-asset-qa-readonly-20261108|375c9cb50c5d6b6ea8dd078ce7c3df5df0e27e48|44'
            'fix/mosigo-production-asset-qa-auth-20261108|5c85fa6bb5d31368c76208ae7b20d341039d5d89|ANCESTOR'
            'fix/p0-p2-ir-overlap-prd-typography-20261108|d88d0aea4635899e56649035b85a9cddaf893c72|45'
            'fix/portfolio-product-only-public-20261108|42eef7543f1eae78a8a1a7a079e3589566ce9fb5|56'
            'fix/prd-english-headings-mobile-table-20261108|8643da8f7312ff08c873a38ab11e8319f2bba447|60'
            'fix/prd-first-screen-link-20261108|ba4b53f400207c3e5493cd9f959735a973ccd666|57'
            'fix/prd-qa-slide-assert-20261108|70a6067bc29c1f1c3e112bffcd905bbe77c54746|48'
            'fix/prd-term-site-qa-20261108|0321d7f110dc6cc0e72aae38a5b5f7548700a424|49'
            'fix/prd-typography-header-20261108|9866ca6b1f14b9dbf066853f1c797502e5488c51|58'
            'fix/production-binary-hash-check-20261108|f74de0c3c78a56c9b00ee2bde1a89db5f5c573b5|62'
            'fix/public-case-qa-readme-20261108|8c9d302767e745743a248fa5a4504465790eae78|59'
            'fix/require-pr-and-qa-generated-assets-20261108|d004881a3294bfdcd27d9c3bcb666584a967a44c|64'
            'fix/sync-pdf-pptx-previews-20261108|e040908f738fe5fe803b571a55b205a03594a626|53'
            'qa/final-verification-20261108|268b85974073fca28b428aae96d3f312cd800e8c|50'
            'strategy/investment-workbook-20261108|99ce279d14d682a1cdf7587eb39e79d97a98dbf0|41'
          )

          # The cleanup PR itself must be merged and is retired by the same safeguards.
          open_prs="$(gh api "$api/pulls?state=open&per_page=100")"
          closed_prs="$(gh api "$api/pulls?state=closed&per_page=100")"
          [[ "$(jq length <<< "$open_prs")" -lt 100 && "$(jq length <<< "$closed_prs")" -lt 100 ]] || {
            echo "::error::Incomplete PR results; refuse retirement"; exit 1;
          }
          self_branch='chore/retire-verified-branches-20261108'
          self_pr="$(jq -er --arg b "$self_branch" '[.[] | select(.head.ref==$b and .base.ref=="main" and .merged_at!=null)] | if length==1 then .[0] else error("cleanup PR not uniquely merged") end' <<< "$closed_prs")"
          self_number="$(jq -r .number <<< "$self_pr")"
          self_sha="$(jq -r .head.sha <<< "$self_pr")"
          [[ "$self_sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          entries+=("$self_branch|$self_sha|$self_number")

          # Full preflight: no ref is deleted before all PR and SHA evidence passes.
          for entry in "${entries[@]}"; do
            IFS='|' read -r name expected pr <<< "$entry"
            [[ "$expected" =~ ^[0-9a-f]{40}$ ]] || exit 1
            [[ "$name" != 'main' && "$name" != 'HEAD' ]] || exit 1
            if jq -e --arg b "$name" 'any(.[]; .head.ref==$b)' <<< "$open_prs" >/dev/null; then
              echo "::error::Open PR exists: $name"; exit 1;
            fi
            if [[ "$pr" == ANCESTOR ]]; then
              ahead="$(gh api "$api/compare/main...${name}" --jq '.ahead_by')"
              [[ "$ahead" == 0 ]] || { echo "::error::Unmerged commits in $name"; exit 1; }
            else
              info="$(gh api "$api/pulls/$pr")"
              jq -e --arg name "$name" --arg sha "$expected" --arg repo "$GITHUB_REPOSITORY" '
                .merged == true and .head.ref==$name and .head.sha==$sha and
                .base.ref=="main" and .head.repo.full_name==$repo
              ' <<< "$info" >/dev/null || { echo "::error::PR mismatch $name #$pr"; exit 1; }
            fi
            actual="$(gh api "$api/git/ref/heads/$name" --jq .object.sha)"
            [[ "$actual" == "$expected" ]] || { echo "::error::Branch SHA changed $name"; exit 1; }
          done

          # Two-phase archive-first retirement: all tags verified before any delete.
          for entry in "${entries[@]}"; do
            IFS='|' read -r name expected pr <<< "$entry"
            tag="archive/20261108/$name"
            if actual="$(gh api "$api/git/ref/tags/$tag" --jq .object.sha 2>/dev/null)"; then
              [[ "$actual" == "$expected" ]] || { echo "::error::Conflicting archive tag $tag"; exit 1; }
            else
              gh api -X POST "$api/git/refs" -f ref="refs/tags/$tag" -f sha="$expected" >/dev/null
            fi
            [[ "$(gh api "$api/git/ref/tags/$tag" --jq .object.sha)" == "$expected" ]] || exit 1
            echo "Verified $tag"
          done

          [[ "$(gh api "$api/git/ref/heads/main" --jq .object.sha)" == "$GITHUB_SHA" ]] || exit 1
          open_prs="$(gh api "$api/pulls?state=open&per_page=100")"
          [[ "$(jq length <<< "$open_prs")" -lt 100 ]] || exit 1

          for entry in "${entries[@]}"; do
            IFS='|' read -r name expected pr <<< "$entry"
            tag="archive/20261108/$name"
            [[ "$(gh api "$api/git/ref/tags/$tag" --jq .object.sha)" == "$expected" ]] || exit 1
            if jq -e --arg b "$name" 'any(.[]; .head.ref==$b)' <<< "$open_prs" >/dev/null; then
              echo "::error::New open PR for $name"; exit 1;
            fi
            [[ "$(gh api "$api/git/ref/heads/$name" --jq .object.sha)" == "$expected" ]] || exit 1
            gh api -X DELETE "$api/git/refs/heads/$name" >/dev/null
            if gh api "$api/git/ref/heads/$name" >/dev/null 2>&1; then
              echo "::error::Branch ref remains: $name"; exit 1
            fi
            echo "Retired $name"
          done
          echo "PASS archived and retired ${#entries[@]} branches; unmerged staging branch preserved."

name: Correct audited PPT and Excel contents

on:
  push:
    branches: [main]
    paths:
      - 'qa/fix-content-consistency.py'
      - '.github/workflows/content-fixes.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mosigo-content-fixes
  cancel-in-progress: false

jobs:
  patch-reviewed-sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install slide editor
        run: python -m pip install --quiet python-pptx==1.0.2
      - name: Apply reviewed cell changes and source citation correction
        run: python qa/fix-content-consistency.py
      - name: Commit revised originals
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/mosigo_model.xlsx downloads/mosigo_report.pptx
          if git diff --cached --quiet; then
            echo "Source documents unchanged"
          else
            git commit -m "fix: align Excel conversion scenario and PPT evidence citation"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Save reviewed source documents
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mosigo-reconciled-model-and-slides
          path: |
            downloads/mosigo_model.xlsx
            downloads/mosigo_report.pptx
          if-no-files-found: error
          retention-days: 14

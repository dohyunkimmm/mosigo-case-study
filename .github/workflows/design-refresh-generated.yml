name: Build design-consistent MOSIGO deliverables
on:
  push:
    branches:
      - design/visual-consistency-20261110
    paths:
      - 'index.html'
      - 'assets/site-v3.css'
      - 'downloads/mosigo_business_plan_20261031.html'
      - 'downloads/mosigo_prd_delivery.html'
      - 'qa/apply-editorial-visual-20261110.py'
      - '.github/workflows/design-refresh-generated.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mosigo-design-refresh-20261110
  cancel-in-progress: false

jobs:
  rebuild-and-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install PDF and PowerPoint renderers
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-impress poppler-utils webp fonts-noto-cjk python3-venv
          python3 -m venv /tmp/mosigo-design-venv
          /tmp/mosigo-design-venv/bin/pip install --quiet python-pptx==1.0.2
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.1
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Install Pretendard fonts
        run: |
          set -euo pipefail
          mkdir -p qa-fonts ~/.local/share/fonts/mosigo
          curl -fSL --retry 3 https://raw.githubusercontent.com/orioncactus/pretendard/main/packages/pretendard/dist/public/static/Pretendard-Regular.otf -o qa-fonts/Pretendard-Regular.otf
          curl -fSL --retry 3 https://raw.githubusercontent.com/orioncactus/pretendard/main/packages/pretendard/dist/public/static/Pretendard-Bold.otf -o qa-fonts/Pretendard-Bold.otf
          cp qa-fonts/Pretendard-*.otf ~/.local/share/fonts/mosigo/
          fc-cache -f
          fc-match Pretendard | grep -qi Pretendard
      - name: Extract original publication content
        run: |
          set -euo pipefail
          mkdir -p /tmp/mosigo-text-before
          pdftotext downloads/mosigo_business_plan_20261031.pdf /tmp/mosigo-text-before/plan.txt
          pdftotext downloads/mosigo_report_preview.pdf /tmp/mosigo-text-before/slides.txt
          pdftotext downloads/MOSIGO_IR_Investment_Review_12slides.pdf /tmp/mosigo-text-before/ir.txt
      - name: Polish existing editable slides without changing their data
        run: |
          set -euo pipefail
          /tmp/mosigo-design-venv/bin/python qa/apply-editorial-visual-20261110.py
      - name: Rebuild the business-plan PDF
        run: |
          set -euo pipefail
          node qa/generate-business-plan.mjs
          test "$(pdfinfo downloads/mosigo_business_plan_20261031.pdf | awk '/^Pages:/ {print $2}')" = "19"
      - name: Export presentation and IR PDFs
        run: |
          set -euo pipefail
          mkdir -p /tmp/mosigo-visual-pdf
          libreoffice -env:UserInstallation=file:///tmp/lo-mosigo-design --headless --convert-to pdf --outdir /tmp/mosigo-visual-pdf downloads/mosigo_report.pptx downloads/MOSIGO_IR_Investment_Review_12slides.pptx
          cp /tmp/mosigo-visual-pdf/mosigo_report.pdf downloads/mosigo_report_preview.pdf
          cp /tmp/mosigo-visual-pdf/MOSIGO_IR_Investment_Review_12slides.pdf downloads/MOSIGO_IR_Investment_Review_12slides.pdf
          test "$(pdfinfo downloads/mosigo_report_preview.pdf | awk '/^Pages:/ {print $2}')" = "11"
          test "$(pdfinfo downloads/MOSIGO_IR_Investment_Review_12slides.pdf | awk '/^Pages:/ {print $2}')" = "12"
          for pdf in downloads/mosigo_business_plan_20261031.pdf downloads/mosigo_report_preview.pdf downloads/MOSIGO_IR_Investment_Review_12slides.pdf; do
            pdffonts "$pdf" | grep -qi Pretendard
          done
      - name: Verify original text, key figures and editable document integrity
        run: |
          set -euo pipefail
          pdftotext downloads/mosigo_business_plan_20261031.pdf /tmp/mosigo-text-before/plan-after.txt
          pdftotext downloads/mosigo_report_preview.pdf /tmp/mosigo-text-before/slides-after.txt
          pdftotext downloads/MOSIGO_IR_Investment_Review_12slides.pdf /tmp/mosigo-text-before/ir-after.txt
          /tmp/mosigo-design-venv/bin/python - <<'PY'
          from pathlib import Path
          import re
          base = Path('/tmp/mosigo-text-before')
          for kind in ('plan', 'slides', 'ir'):
              before = (base / (kind + '.txt')).read_text()
              after = (base / (kind + '-after.txt')).read_text()
              normalized = lambda t: re.sub(r'\s+', '', t)
              assert normalized(before) == normalized(after), kind + ': original publication text changed'
              print('PASS ' + kind + ': original publication text unchanged')
          PY
          python3 qa/check-document-design.py
      - name: Rebuild all 42 PDF pages as 84 full and mobile previews
        run: |
          set -euo pipefail
          mkdir -p downloads/previews /tmp/mosigo-visual-renders
          for spec in 'plan:19:mosigo_business_plan_20261031.pdf' 'slides:11:mosigo_report_preview.pdf' 'ir:12:MOSIGO_IR_Investment_Review_12slides.pdf'; do
            IFS=: read -r prefix total pdf <<< "$spec"
            for page in $(seq 1 "$total"); do
              padded="$(printf '%02d' "$page")"
              pdftoppm -f "$page" -l "$page" -scale-to 1400 -png -singlefile "downloads/$pdf" /tmp/mosigo-visual-renders/page
              cwebp -quiet -q 84 -m 6 /tmp/mosigo-visual-renders/page.png -o "downloads/previews/$prefix-$padded.webp"
              cwebp -quiet -q 82 -m 6 -resize 800 0 /tmp/mosigo-visual-renders/page.png -o "downloads/previews/$prefix-$padded-sm.webp"
              test "$(stat -c%s "downloads/previews/$prefix-$padded.webp")" -gt 1000
            done
            test "$(find downloads/previews -maxdepth 1 -name "$prefix-*.webp" | wc -l)" -eq "$((total * 2))"
          done
      - name: Commit refreshed documents to the design review branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/mosigo_business_plan_20261031.pdf \
                  downloads/mosigo_report.pptx downloads/mosigo_report_preview.pdf \
                  downloads/MOSIGO_IR_Investment_Review_12slides.pptx \
                  downloads/MOSIGO_IR_Investment_Review_12slides.pdf \
                  downloads/previews/plan-*.webp downloads/previews/slides-*.webp downloads/previews/ir-*.webp
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changed rendered outputs."
          else
            git commit -m "design: regenerate consistent MOSIGO document and slide assets"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Upload regenerated assets for visual QA
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mosigo-visual-refresh-documents
          path: |
            downloads/*.pdf
            downloads/*.pptx
            downloads/previews/plan-*.webp
            downloads/previews/slides-*.webp
            downloads/previews/ir-*.webp
          if-no-files-found: warn
          retention-days: 14

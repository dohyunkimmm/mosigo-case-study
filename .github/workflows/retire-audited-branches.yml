name: Retire audited branches (one time)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retire-audited-branches.yml'
permissions:
  contents: write
jobs:
  archive-and-retire:
    if: github.repository == 'dohyunkimmm/mosigo-case-study' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify immutable branch heads, archive as tags, then delete branch refs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The expected SHA list was audited before the workflow was merged.
          # Fail closed on concurrent branch changes or newly opened PRs.
          entries="$(cat <<'BRANCHES'
          business-plan/new-20261031|0ca22c4d4d5d94bdf67bce86d4f2ce6339e6d5a0
          case-study/add-notion-original-business-plan-20261031|16304489641a0e1d97022e34b1c6e884d6ea9e70
          case-study/notion-plan-jd-decision-20261031|a13833c30030f93d94cd8960d7509edeaf954d7d
          chore/qa-repo-cleanup-20261031|a2699be376676667c828ea35a2c8bd0f40f0354b
          portfolio/decision-memos-20261030|be50960538e7b0d380e6b8c524060da8cef93e4e
          portfolio/forecast-management-20261030|5f8d1fa575f1bae0f1b3bcb60f866cb3a43245f0
          portfolio/independent-materials-20261030|fda9bc9d237a0cfa1285830701b36f0fa933180b
          portfolio/inline-analysis-20261030|dfa84fcd761354d7d198ee4dbb80228247229f36
          portfolio/native-downloads-20261030|030b461cf6f65e2c515794ae65fa32ead56b9b12
          portfolio/report-pager-20261030|efad5ede811a40e874b6617682d83d6d9fdc64d9
          qa/mosigo-business-plan-approved-fixes-20261031|d21ceb594ca13978111aefd704971fd41995f4d4
          test/case-study-table-count-20261031|6c7b235a5a940b289fef00dee541091c2a0b8eae
          BRANCHES
          )"
          while IFS='|' read -r branch expected; do
            [[ -z "$branch" ]] && continue
            actual="$(gh api "repos/$GH_REPO/git/ref/heads/$branch" --jq '.object.sha')"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::Ref changed for $branch: $actual (expected $expected)"
              exit 1
            fi
            open_prs="$(gh api "repos/$GH_REPO/pulls?state=open&per_page=100" | jq --arg branch "$branch" '[.[] | select(.head.ref == $branch)] | length')"
            if [[ "$open_prs" != "0" ]]; then
              echo "::error::Open PR exists for $branch, refusing deletion"
              exit 1
            fi
          done <<< "$entries"
          while IFS='|' read -r branch expected; do
            [[ -z "$branch" ]] && continue
            tag="archive/20261031/$branch"
            if existing="$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null)"; then
              [[ "$existing" == "$expected" ]] || { echo "::error::Archive tag mismatch: $tag"; exit 1; }
            else
              gh api --method POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$expected" >/dev/null
            fi
            archived="$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object.sha')"
            [[ "$archived" == "$expected" ]] || { echo "::error::Archive verification failed: $tag"; exit 1; }
            actual="$(gh api "repos/$GH_REPO/git/ref/heads/$branch" --jq '.object.sha')"
            [[ "$actual" == "$expected" ]] || { echo "::error::Branch moved after preflight: $branch"; exit 1; }
            gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$branch"
            echo "Archived and retired $branch -> $tag ($expected)"
            echo "- \`$branch\` -> \`$tag\` (\`$expected\`)" >> "$GITHUB_STEP_SUMMARY"
          done <<< "$entries"
          # Also retire the source branch of this merged maintenance PR.
          source_branch="chore/retire-audited-branches-20261031"
          merged_pr="$(gh api "repos/$GH_REPO/pulls?state=closed&per_page=100" | jq --arg branch "$source_branch" '[.[] | select(.head.ref == $branch and .base.ref == "main" and .merged_at != null)] | sort_by(.merged_at) | last')"
          source_sha="$(jq -r '.head.sha // empty' <<< "$merged_pr")"
          if [[ -z "$source_sha" ]]; then
            echo "::warning::Merged maintenance PR not found; leaving $source_branch untouched"
          else
            current="$(gh api "repos/$GH_REPO/git/ref/heads/$source_branch" --jq '.object.sha')"
            [[ "$current" == "$source_sha" ]] || { echo "::error::Maintenance PR branch moved; refusing deletion"; exit 1; }
            tag="archive/20261031/$source_branch"
            if existing="$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null)"; then
              [[ "$existing" == "$source_sha" ]] || { echo "::error::Maintenance archive tag mismatch"; exit 1; }
            else
              gh api --method POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$source_sha" >/dev/null
            fi
            archived="$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object.sha')"
            [[ "$archived" == "$source_sha" ]] || { echo "::error::Maintenance archive verification failed"; exit 1; }
            gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$source_branch"
            echo "Archived and retired $source_branch -> $tag ($source_sha)" >> "$GITHUB_STEP_SUMMARY"
          fi

name: Build case-study social preview

on:
  push:
    branches: [main]
    paths:
      - 'qa/share-card.html'
      - '.github/workflows/build-social-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-share-card:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install Chromium for image rendering
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.1
          npx --no-install playwright install --with-deps chromium
      - name: Render 1200x630 social preview
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import { resolve } from 'node:path';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1200,height:630},deviceScaleFactor:1});
          await page.goto('file://'+resolve('qa/share-card.html'),{waitUntil:'load'});
          await page.evaluate(()=>document.fonts.ready);
          await page.screenshot({path:'assets/mosigo-share.png'});
          await browser.close();
          JS
          file assets/mosigo-share.png
          test "$(stat -c%s assets/mosigo-share.png)" -gt 12000
      - name: Publish social image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/mosigo-share.png
          if ! git diff --cached --quiet; then
            git commit -m "assets: publish MOSIGO social sharing preview"
            git push origin HEAD:main
          fi

# One-time guarded retirement; starts only when this file is merged/changed on main.
name: Retire merged Case Study branches (2026-11-07)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/retire-merged-branches-20261107.yml']
permissions:
  contents: write
  pull-requests: read
jobs:
  archive-and-retire:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify merged PRs, archive exact branch SHAs, then remove refs
        shell: bash
        run: |
          #!/usr/bin/env bash
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          main_sha="$(curl -fsS "${auth[@]}" "$api/git/ref/heads/main" | jq -r .object.sha)"
          [[ "$GITHUB_REF" == "refs/heads/main" && "$main_sha" == "$GITHUB_SHA" ]] || { echo "::error::main has moved"; exit 1; }
          open_prs="$(curl -fsS "${auth[@]}" "$api/pulls?state=open&per_page=100")"
          [[ "$(jq length <<< "$open_prs")" -lt 100 ]] || { echo "::error::open PR list incomplete"; exit 1; }
          closed_prs="$(curl -fsS "${auth[@]}" "$api/pulls?state=closed&per_page=100")"
          [[ "$(jq length <<< "$closed_prs")" -lt 100 ]] || { echo "::error::closed PR list incomplete"; exit 1; }
          self_pr="$(jq -r '[.[] | select(.head.ref=="chore/retire-merged-branches-20261107" and .base.ref=="main" and .merged_at!=null) | .number] | if length==1 then .[0] else empty end' <<< "$closed_prs")"
          [[ "$self_pr" =~ ^[0-9]+$ ]] || { echo "::error::cleanup PR not uniquely merged"; exit 1; }
          branches=("codex/mosigo-bep-label" "codex/mosigo-compact-viewer" "codex/mosigo-ir-rounding-label" "codex/mosigo-readable-documents" "codex/mosigo-zoom-metrics" "ops/vercel-deployment-cleanup-20261106" "review/finish-evidence-and-publication-qa-20261104" "review/p0-p1-p2-final-qa-20261106" "review/p0-p1-p2-qa-20261104" "review/p1-p2-market-price-ir-20261105" "review/report-search-evidence-20261106" "chore/cleanup-qa-and-repo-20261107" "chore/retire-merged-branches-20261107")
          heads=("6557dd0eff05f8a0109eb39d14b785ed51bdf335" "412749704d49ca26fbee38034716d86953e5c085" "fc75a03e87d158e3a87f738f6dfe6f390c5ca822" "9be7076585f0351840898630c2a11b7454a029f0" "6b6d3d6a4a248fc61ba219aa66194b4e23033b62" "de2a96fa91c6c0b503e25e65931323d535fb71ce" "44bc6cc68987eeba256408fa97839f20212b6b71" "8186814a08adaac8e230a83fabd3b0a8319a47da" "745305889f88d90f0204725f4409bb1d69362785" "c8d21e805d2a44c5af03e71ad71e0a2495979db5" "bf6a00d05a675745b96e6d6e60dc5640879119aa" "d28f8a6e3af96eb7882cb6bcb755a5c883bdf2ac" "FROM_MERGED_PR")
          prs=("32" "33" "37" "34" "35" "36" "28" "30" "27" "29" "31" "38" "AUTO")
          prs[12]="$self_pr"
          declare -a verified_heads
          # Preflight every branch and its merged PR before creating any archive or deleting any ref.
          for i in "${!branches[@]}"; do
            branch="${branches[$i]}"; expected="${heads[$i]}"; pr="${prs[$i]}"
            pr_info="$(curl -fsS "${auth[@]}" "$api/pulls/${pr}")"
            [[ "$(jq -r .merged <<< "$pr_info")" == "true" ]] || { echo "::error::PR not merged: $pr"; exit 1; }
            [[ "$(jq -r .head.ref <<< "$pr_info")" == "$branch" && "$(jq -r .base.ref <<< "$pr_info")" == "main" ]] || exit 1
            [[ "$(jq -r .head.repo.full_name <<< "$pr_info")" == "$GITHUB_REPOSITORY" ]] || exit 1
            [[ "$(jq -r .head.sha <<< "$pr_info")" =~ ^[[:xdigit:]]{40}$ ]] || exit 1
            if [[ "$expected" == "FROM_MERGED_PR" ]]; then expected="$(jq -r .head.sha <<< "$pr_info")"; fi
            [[ "$(jq -r .head.sha <<< "$pr_info")" == "$expected" ]] || { echo "::error::PR HEAD mismatch: $branch"; exit 1; }
            if jq -e --arg b "$branch" 'any(.[]; .head.ref==$b)' <<< "$open_prs" >/dev/null; then echo "::error::open PR: $branch"; exit 1; fi
            code="$(curl -sS -o "$RUNNER_TEMP/branch.json" -w "%{http_code}" "${auth[@]}" "$api/git/ref/heads/${branch}")"
            [[ "$code" == 200 || "$code" == 404 ]] || { echo "::error::branch read failed: $branch HTTP $code"; exit 1; }
            if [[ "$code" == 200 ]]; then [[ "$(jq -r .object.sha "$RUNNER_TEMP/branch.json")" == "$expected" ]] || { echo "::error::branch moved: $branch"; exit 1; }; fi
            verified_heads[$i]="$expected"
          done
          # Create lightweight archive tags for all original branch tips, then verify every tag.
          for i in "${!branches[@]}"; do
            branch="${branches[$i]}"; expected="${verified_heads[$i]}"; tag="archive/20261107/${branch}"
            code="$(curl -sS -o "$RUNNER_TEMP/tag.json" -w "%{http_code}" "${auth[@]}" "$api/git/ref/tags/${tag}")"
            if [[ "$code" == 404 ]]; then
              payload="$(jq -nc --arg ref "refs/tags/${tag}" --arg sha "$expected" '{ref:$ref,sha:$sha}')"
              curl -fsS "${auth[@]}" -X POST -d "$payload" "$api/git/refs" > /dev/null
            elif [[ "$code" != 200 ]]; then echo "::error::tag read failed $tag"; exit 1; fi
            actual="$(curl -fsS "${auth[@]}" "$api/git/ref/tags/${tag}" | jq -r .object.sha)"
            [[ "$actual" == "$expected" ]] || { echo "::error::archive mismatch $tag"; exit 1; }
            echo "Verified archive $tag -> $expected"
          done
          # Fail closed if main moved or any referenced PR was reopened.
          [[ "$(curl -fsS "${auth[@]}" "$api/git/ref/heads/main" | jq -r .object.sha)" == "$GITHUB_SHA" ]] || exit 1
          open_prs="$(curl -fsS "${auth[@]}" "$api/pulls?state=open&per_page=100")"
          [[ "$(jq length <<< "$open_prs")" -lt 100 ]] || exit 1
          for i in "${!branches[@]}"; do
            branch="${branches[$i]}"; expected="${verified_heads[$i]}"; tag="archive/20261107/${branch}"
            if jq -e --arg b "$branch" 'any(.[]; .head.ref==$b)' <<< "$open_prs" >/dev/null; then echo "::error::open PR: $branch"; exit 1; fi
            [[ "$(curl -fsS "${auth[@]}" "$api/git/ref/tags/${tag}" | jq -r .object.sha)" == "$expected" ]] || exit 1
            code="$(curl -sS -o "$RUNNER_TEMP/branch.json" -w "%{http_code}" "${auth[@]}" "$api/git/ref/heads/${branch}")"
            if [[ "$code" == 404 ]]; then echo "Already retired: $branch"; continue; fi
            [[ "$code" == 200 && "$(jq -r .object.sha "$RUNNER_TEMP/branch.json")" == "$expected" ]] || { echo "::error::branch moved: $branch"; exit 1; }
            curl -fsS "${auth[@]}" -X DELETE "$api/git/refs/heads/${branch}" > /dev/null
            code="$(curl -sS -o /dev/null -w "%{http_code}" "${auth[@]}" "$api/git/ref/heads/${branch}")"
            [[ "$code" == 404 ]] || { echo "::error::branch still exists: $branch"; exit 1; }
            echo "Retired $branch; preserved $tag"
          done
          echo "PASS guarded archived branch retirement: ${#branches[@]} refs"

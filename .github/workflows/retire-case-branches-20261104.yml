# One-time guarded cleanup of two merged MOSIGO Case Study branches.
# Runs only when this file first lands on main via an approved PR.
name: Retire audited Case Study branches (2026-11-04)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retire-case-branches-20261104.yml'
permissions:
  contents: write
  pull-requests: read
jobs:
  preserve-and-retire:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify merged PR heads, archive exact SHAs, then retire branch refs
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          repo_main="$(curl -fsS "${auth[@]}" "${api}/git/ref/heads/main" | jq -r '.object.sha')"
          test "${repo_main}" = "${GITHUB_SHA}" || { echo "::error::main moved since trigger"; exit 1; }
          open_prs="$(curl -fsS "${auth[@]}" "${api}/pulls?state=open&per_page=100")"
          # Archive both originals first; retire only after BOTH archives are verified.
          branches=(
            "design/case-study-visual-qa-20261103"
            "fix/mosigo-editorial-slide-layout-20261104"
          )
          heads=(
            "667c68f52e80700942f886ec39da800a34748d56"
            "039a6f104c71e4974a56a1ddf2c71d0ca1e2be36"
          )
          prs=(23 24)
          for i in 0 1; do
            branch="${branches[$i]}"
            expected="${heads[$i]}"
            pr="${prs[$i]}"
            archive="archive/20261104/${branch}"
            pr_info="$(curl -fsS "${auth[@]}" "${api}/pulls/${pr}")"
            test "$(jq -r '.merged' <<<"${pr_info}")" = true || { echo "::error::PR ${pr} not merged"; exit 1; }
            test "$(jq -r '.head.sha' <<<"${pr_info}")" = "${expected}" || { echo "::error::PR HEAD changed"; exit 1; }
            test "$(jq --arg b "${branch}" '[.[] | select(.head.ref == $b)] | length' <<<"${open_prs}")" = 0 || { echo "::error::open PR for ${branch}"; exit 1; }
            code="$(curl -sS -o /tmp/branch_ref.json -w '%{http_code}' "${auth[@]}" "${api}/git/ref/heads/${branch}")"
            if [ "${code}" = 404 ]; then
              echo "Already retired: ${branch}"
              continue
            fi
            test "${code}" = 200 || { echo "::error::branch read HTTP ${code}"; exit 1; }
            test "$(jq -r '.object.sha' /tmp/branch_ref.json)" = "${expected}" || { echo "::error::branch HEAD changed"; exit 1; }
            code="$(curl -sS -o /tmp/archive_ref.json -w '%{http_code}' "${auth[@]}" "${api}/git/ref/tags/${archive}")"
            if [ "${code}" = 404 ]; then
              payload="$(jq -nc --arg ref "refs/tags/${archive}" --arg sha "${expected}" '{ref:$ref,sha:$sha}')"
              curl -fsS "${auth[@]}" -X POST -d "${payload}" "${api}/git/refs" >/dev/null
            elif [ "${code}" != 200 ]; then
              echo "::error::archive read HTTP ${code}"
              exit 1
            fi
            tag_sha="$(curl -fsS "${auth[@]}" "${api}/git/ref/tags/${archive}" | jq -r '.object.sha')"
            test "${tag_sha}" = "${expected}" || { echo "::error::archive SHA mismatch"; exit 1; }
            echo "Verified archive: ${archive} -> ${expected}"
          done
          for i in 0 1; do
            branch="${branches[$i]}"
            expected="${heads[$i]}"
            archive="archive/20261104/${branch}"
            code="$(curl -sS -o /tmp/branch_verify.json -w '%{http_code}' "${auth[@]}" "${api}/git/ref/heads/${branch}")"
            if [ "${code}" = 404 ]; then
              echo "Already retired: ${branch}"
              continue
            fi
            test "${code}" = 200 || exit 1
            test "$(jq -r '.object.sha' /tmp/branch_verify.json)" = "${expected}" || exit 1
            test "$(curl -fsS "${auth[@]}" "${api}/git/ref/tags/${archive}" | jq -r '.object.sha')" = "${expected}" || exit 1
            curl -fsS "${auth[@]}" -X DELETE "${api}/git/refs/heads/${branch}" >/dev/null
            final_code="$(curl -sS -o /dev/null -w '%{http_code}' "${auth[@]}" "${api}/git/ref/heads/${branch}")"
            test "${final_code}" = 404 || { echo "::error::branch still exists"; exit 1; }
            echo "Retired ${branch}; preserved ${archive}"
          done

name: Render Tossface icon without runtime webfont cost

on:
  push:
    branches: [main]
    paths:
      - 'qa/render-tossface-icon.mjs'
      - '.github/workflows/tossface-icon.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.1
          npx --no-install playwright install --with-deps chromium
      - name: Render official Tossface phone emoji as transparent PNG
        run: node qa/render-tossface-icon.mjs
      - name: Save icon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/tossface-phone.png
          if ! git diff --cached --quiet; then
            git commit -m "assets: use original Tossface glyph as light static icon"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload icon for visual verification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mosigo-tossface-icon
          path: assets/tossface-phone.png
          if-no-files-found: ignore
          retention-days: 7

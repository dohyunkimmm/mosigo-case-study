name: Generated PR publication safety

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/scripts/publish-generated-pr.sh'
      - 'qa/test-publish-generated-pr.py'
      - '.github/workflows/generated-pr-publication-qa.yml'
  push:
    branches: [main]
    paths:
      - '.github/scripts/publish-generated-pr.sh'
      - 'qa/test-publish-generated-pr.py'
      - '.github/workflows/generated-pr-publication-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard-regressions:
    name: Verify deduplicated generated PR publication
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate Bash syntax
        run: bash -n .github/scripts/publish-generated-pr.sh
      - name: Verify no-op, pending PR, fresh publish and safety behavior
        run: python3 qa/test-publish-generated-pr.py

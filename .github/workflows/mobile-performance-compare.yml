name: Investigate mobile performance measurement

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-performance-compare.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install Lighthouse and Chromium
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.1 lighthouse@13.6.0
          npx --no-install playwright install --with-deps chromium
      - name: Measure lab-throttled and unthrottled timings
        run: |
          set -euo pipefail
          mkdir -p qa-artifacts
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          sleep 2
          export CHROME_PATH="$(node -p "require('playwright').chromium.executablePath()")"
          npx --no-install lighthouse http://127.0.0.1:8765/ --only-categories=performance,accessibility --form-factor=mobile --throttling-method=devtools --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --output=json --output-path=qa-artifacts/devtools-mobile.json --quiet
          npx --no-install lighthouse http://127.0.0.1:8765/ --only-categories=performance,accessibility --form-factor=mobile --throttling-method=provided --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --output=json --output-path=qa-artifacts/provided-mobile.json --quiet
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          for(const mode of ['devtools','provided']){
            const d=JSON.parse(fs.readFileSync('qa-artifacts/'+mode+'-mobile.json','utf8'));
            const a=d.audits.metrics.details.items[0];
            console.log('MEASURE',mode,'score',Math.round(d.categories.performance.score*100),'LCP',a.largestContentfulPaint,'observed LCP',a.observedLargestContentfulPaint,'FCP',a.firstContentfulPaint);
          }
          NODE
      - name: Upload mobile performance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mosigo-mobile-performance-measurements
          path: qa-artifacts/
          if-no-files-found: ignore
          retention-days: 7

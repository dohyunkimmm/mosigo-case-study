name: Build PPT preview PDF

on:
  push:
    branches: [main, 'review/p0-p1-p2-*']
    paths:
      - 'downloads/mosigo_report.pptx'
      - 'qa/style-presentation.py'
      - 'qa/sync-strategy-copy.py'
      - 'qa/fix-presentation-overlaps.py'
      - 'qa/refine-decks.py'
      - 'qa/apply-strategy-20261107.py'
      - 'qa/visual-polish-20261108.py'
      - 'qa/focus-service-pm-decks-20261108.py'
      - 'qa/final-presentation-readability-20261108.py'
      - 'downloads/mosigo_model.xlsx'
  pull_request:
    branches: [main, 'review/p0-p1-p2-*']
    paths:
      - 'downloads/mosigo_report.pptx'
      - 'qa/style-presentation.py'
      - 'qa/sync-strategy-copy.py'
      - 'qa/fix-presentation-overlaps.py'
      - 'qa/refine-decks.py'
      - 'qa/apply-strategy-20261107.py'
      - 'qa/visual-polish-20261108.py'
      - 'qa/focus-service-pm-decks-20261108.py'
      - 'qa/final-presentation-readability-20261108.py'
      - 'downloads/mosigo_model.xlsx'
      - '.github/workflows/ppt-preview.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: mosigo-ppt-preview-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  convert:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Install document renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-impress poppler-utils fonts-noto-cjk fonts-nanum python3-venv webp
      - name: Install Pretendard and normalize editable slides
        run: |
          set -euo pipefail
          mkdir -p ~/.local/share/fonts/mosigo
          curl -fSL --retry 3 https://raw.githubusercontent.com/orioncactus/pretendard/main/packages/pretendard/dist/public/static/Pretendard-Regular.otf -o ~/.local/share/fonts/mosigo/Pretendard-Regular.otf
          curl -fSL --retry 3 https://raw.githubusercontent.com/orioncactus/pretendard/main/packages/pretendard/dist/public/static/Pretendard-Bold.otf -o ~/.local/share/fonts/mosigo/Pretendard-Bold.otf
          fc-cache -f
          fc-match Pretendard | grep -qi Pretendard
          python3 -m venv /tmp/mosigo-ppt-venv
          /tmp/mosigo-ppt-venv/bin/pip install --quiet python-pptx==1.0.2
          /tmp/mosigo-ppt-venv/bin/python qa/style-presentation.py
      - name: Detect already synchronized product-planning deck
        id: current-deck
        run: |
          if /tmp/mosigo-ppt-venv/bin/python -c 'from pptx import Presentation; p=Presentation("downloads/mosigo_report.pptx"); text=" ".join(s.text for slide in p.slides for s in slide.shapes if s.has_text_frame); assert len(p.slides)==11 and "제품기획 산출물과 후속 검증" in text and "대리 예약의 핵심 경험과 요구사항" in text'; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Current product-planning copy already synchronized; preserve editable source."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Legacy presentation source detected; run editorial generators."
          fi
      - name: Synchronize editable strategic decisions with quantified gap
        if: steps.current-deck.outputs.ready != 'true'
        run: /tmp/mosigo-ppt-venv/bin/python qa/sync-strategy-copy.py
      - name: Repair slide table overlaps and Korean copy
        if: steps.current-deck.outputs.ready != 'true'
        run: /tmp/mosigo-ppt-venv/bin/python qa/fix-presentation-overlaps.py
      - name: Apply capacity and editorial QA refinements
        if: steps.current-deck.outputs.ready != 'true'
        run: /tmp/mosigo-ppt-venv/bin/python qa/refine-decks.py strategy
      - name: Align investment strategy and Pretendard typography
        if: steps.current-deck.outputs.ready != 'true'
        run: /tmp/mosigo-ppt-venv/bin/python qa/apply-strategy-20261107.py strategy
      - name: Visualize four investment decisions in editable final slide
        if: steps.current-deck.outputs.ready != 'true'
        run: /tmp/mosigo-ppt-venv/bin/python qa/visual-polish-20261108.py strategy
      - name: Align main MOSIGO presentation with PRD, delivery and acceptance
        if: steps.current-deck.outputs.ready != 'true'
        run: /tmp/mosigo-ppt-venv/bin/python qa/focus-service-pm-decks-20261108.py strategy
      - name: Replace repeated finance page with PRD evidence and acceptance trace
        if: steps.current-deck.outputs.ready != 'true'
        run: /tmp/mosigo-ppt-venv/bin/python qa/final-presentation-readability-20261108.py strategy
      - name: Convert existing presentation for inline viewing
        run: |
          set -euo pipefail
          mkdir -p /tmp/mosigo-slides
          libreoffice -env:UserInstallation=file:///tmp/lo-mosigo-ppt-preview --headless --convert-to pdf --outdir /tmp/mosigo-slides downloads/mosigo_report.pptx
          test -s /tmp/mosigo-slides/mosigo_report.pdf
          if [[ -s downloads/mosigo_report_preview.pdf ]]; then
            cp downloads/mosigo_report_preview.pdf /tmp/mosigo-preview-before.pdf
          fi
          pages="$(pdfinfo /tmp/mosigo-slides/mosigo_report.pdf | awk '/^Pages:/ {print $2}')"
          test "$pages" -gt 0
          cp /tmp/mosigo-slides/mosigo_report.pdf downloads/mosigo_report_preview.pdf
          echo "Generated preview PDF: $pages slides"
          pdfinfo downloads/mosigo_report_preview.pdf | grep -E 'Pages:|Page size:|File size:'
          test "$pages" = "11"
          pdffonts downloads/mosigo_report_preview.pdf | grep -qi Pretendard
      - name: Render all 11 browser-independent presentation pages
        run: |
          set -euo pipefail
          mkdir -p downloads/previews /tmp/mosigo-ppt-pages
          for page in $(seq 1 11); do
            padded="$(printf '%02d' "$page")"
            pdftoppm -f "$page" -l "$page" -scale-to 1400 -png -singlefile downloads/mosigo_report_preview.pdf /tmp/mosigo-ppt-pages/page
            cwebp -quiet -q 84 -m 6 /tmp/mosigo-ppt-pages/page.png -o "downloads/previews/slides-$padded.webp"
            cwebp -quiet -q 82 -m 6 -resize 800 0 /tmp/mosigo-ppt-pages/page.png -o "downloads/previews/slides-$padded-sm.webp"
            test "$(stat -c%s "downloads/previews/slides-$padded.webp")" -gt 1000
          done
          test "$(find downloads/previews -maxdepth 1 -name 'slides-*.webp' | wc -l)" -eq 22
          pdftotext downloads/mosigo_report_preview.pdf /tmp/mosigo-ppt-text.txt
          if grep -Eq '검토 방향로|산정 기준한|고객 설정로' /tmp/mosigo-ppt-text.txt; then
            echo "::error::Presentation contains an unreviewed Korean phrase"
            exit 1
          fi
          if grep -q '11~12쪽' /tmp/mosigo-ppt-text.txt; then echo "::error::Stale PPT source citation"; exit 1; fi
          grep -Eq '사업기획서[[:space:]]*3[[:space:]]*쪽' /tmp/mosigo-ppt-text.txt
      - name: Preserve equivalent PDF when only renderer metadata changed
        run: |
          set -euo pipefail
          previous=/tmp/mosigo-preview-before.pdf
          current=downloads/mosigo_report_preview.pdf
          # Require identical rendered WebP images and extracted text, not merely matching page counts.
          if [[ -s "$previous" ]] &&
             [[ "$(pdfinfo "$previous" | awk '/^Pages:/ {print $2}')" = "11" ]] &&
             git diff --quiet -- downloads/previews/slides-*.webp &&
             cmp -s <(pdftotext -layout "$previous" -) <(pdftotext -layout "$current" -); then
            cp "$previous" "$current"
            echo "PDF pages and rendered slide previews unchanged; preserving original PDF bytes."
          else
            echo "Content or visual differences found; retaining regenerated PDF for review."
          fi
      - name: Open PR for regenerated ppt-preview assets
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/publish-generated-pr.sh ppt-preview 'docs: update presentation and preview files' downloads/mosigo_report.pptx downloads/mosigo_report_preview.pdf downloads/previews/slides-*.webp
      - name: Upload preview for inspection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mosigo-ppt-preview
          path: |
            downloads/mosigo_report_preview.pdf
            downloads/mosigo_report.pptx
            downloads/previews/slides-*.webp
          if-no-files-found: error
          retention-days: 14

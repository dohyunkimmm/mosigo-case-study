name: Audit generated PR content

on:
  pull_request:
    branches: [main]
    paths:
      - 'qa/audit-generated-prs.py'
      - '.github/workflows/audit-generated-prs.yml'
  push:
    branches: [main]
    paths:
      - 'qa/audit-generated-prs.py'
      - '.github/workflows/audit-generated-prs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: audit-generated-prs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit-generated:
    name: Compare generated PDFs, PPTX and WebP with main
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit readers
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 pymupdf==1.26.4
      - name: Compare all open generated PR artifacts (read only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python qa/audit-generated-prs.py
      - name: Publish comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-pr-content-audit
          path: qa-artifacts/generated-pr-audit.json
          if-no-files-found: warn
          retention-days: 30

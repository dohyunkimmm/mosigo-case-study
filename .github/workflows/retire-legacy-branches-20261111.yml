# One-time audit. Archive exact unmerged automation heads before retiring stale refs.
name: Retire reviewed MOSIGO historical automation branches
on:
  push:
    branches: [main]
    paths: ['.github/workflows/retire-legacy-branches-20261111.yml']
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: mosigo-historical-ref-cleanup
  cancel-in-progress: false
jobs:
  retire:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preflight every branch, archive all exact SHA tags, retire only verified refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY"
          main="$(gh api "$api/git/ref/heads/main" --jq .object.sha)"
          [[ "$main" == "$GITHUB_SHA" ]] || { echo "::error::main moved since the audit"; exit 1; }
          open="$(gh api "$api/pulls?state=open&per_page=100")"
          [[ "$(jq length <<< "$open")" -lt 100 ]] || { echo "::error::Open PR list may be incomplete"; exit 1; }
          mapfile -t rows <<'MANIFEST'
          72|automation/business-plan-42488176012-1|998310bd7f6702756a74bae022896be4879d18d0|superseded|82
          73|automation/ppt-preview-42488176018-1|b8f5bed9d352776de4fd0b49ed4eaccd63950070|superseded|82
          75|automation/social-card-42534725009-1|5d2fbb1c4879344cd54b38eeb9d9587e2d47d384|reconciled|76
          83|automation/ppt-preview-42571108906-1|9ad2406fd1496b4f81e8beb6632db9b4475d4f7d|superseded|84
          89|automation/business-plan-42825787971-1|0a0a4e7f19ccaf1171a018d4187906bff0928dcc|superseded|90
          91|automation/ir-deck-42825787422-2|f01cf85d75b410cda7c66e3ffc3f5086e92eb5d1|superseded|92
          95|automation/ppt-preview-43023385691-1|ee3a428b4cde7f1bd17fbb2c14cd520d144ace67|reconciled|98
          96|automation/business-plan-43023385912-1|e9fc27e24589fe8003d260f36cbe4cb0129d05e2|reconciled|98
          97|automation/ir-deck-43023385832-1|9ff740486bb22a3bdc6c35d44665aa5b25cf71a0|reconciled|98
          MANIFEST
          # Preflight ALL rows before creating tags or deleting any refs.
          for row in "${rows[@]}"; do
            IFS='|' read -r number name sha mode replacement <<< "$row"
            [[ "$name" != main && "$sha" =~ ^[0-9a-f]{40}$ && "$number" =~ ^[0-9]+$ ]] || exit 1
            pr="$(gh api "$api/pulls/$number")"
            jq -e --arg b "$name" --arg s "$sha" --arg repo "$GITHUB_REPOSITORY" --arg mode "$mode" \
              '.state=="closed" and .head.ref==$b and .head.sha==$s and .head.repo.full_name==$repo and .base.ref=="main" and (if $mode == "merged" then .merged==true else .merged==false end)' <<< "$pr" >/dev/null || exit 1
            if [[ "$mode" == superseded || "$mode" == reconciled ]]; then
              [[ "$replacement" =~ ^[0-9]+$ ]] || exit 1
              [[ "$(gh api "$api/pulls/$replacement" --jq .merged)" == true ]] || { echo "::error::Replacement PR not merged: $replacement"; exit 1; }
              files="$(gh api "$api/pulls/$number/files?per_page=100")"
              jq -e '(length > 0 and length < 100) and all(.[]; .status == "modified" and ((.filename | startswith("downloads/")) or .filename == "assets/mosigo-share.png"))' <<< "$files" >/dev/null || exit 1
              while IFS=
            if jq -e --arg b "$name" 'any(.[]; .head.ref==$b)' <<< "$open" >/dev/null; then
              echo "::error::Open PR still uses $name"; exit 1
            fi
            tag="archive/20261111/reviewed/pr-$number/$name"
            tag_json="$(gh api "$api/git/ref/tags/$tag" 2>/dev/null || true)"
            tagged="$(jq -r --arg ref "refs/tags/$tag" 'if type=="object" and .ref==$ref then (.object.sha // "") else "" end' <<< "${tag_json:-null}" 2>/dev/null || true)"
            [[ -z "$tagged" || "$tagged" == "$sha" ]] || { echo "::error::Archive tag $tag points to unexpected SHA: $tagged"; exit 1; }
            branch_json="$(gh api "$api/git/ref/heads/$name" 2>/dev/null || true)"
            branchsha="$(jq -r --arg ref "refs/heads/$name" 'if type=="object" and .ref==$ref then (.object.sha // "") else "" end' <<< "${branch_json:-null}" 2>/dev/null || true)"
            [[ "$branchsha" == "$sha" || ( -z "$branchsha" && "$tagged" == "$sha" ) ]] || { echo "::error::Branch SHA mismatch $name"; exit 1; }
            echo "VERIFIED PR #$number $name"
          done
          # Create and verify ALL immutable recovery pointers first.
          for row in "${rows[@]}"; do
            IFS='|' read -r number name sha mode replacement <<< "$row"
            tag="archive/20261111/reviewed/pr-$number/$name"
            if ! gh api "$api/git/ref/tags/$tag" >/dev/null 2>&1; then
              gh api -X POST "$api/git/refs" -f ref="refs/tags/$tag" -f sha="$sha" >/dev/null
            fi
            [[ "$(gh api "$api/git/ref/tags/$tag" --jq .object.sha)" == "$sha" ]] || exit 1
          done
          # Exact-SHA lease and open-PR check immediately precede deletion.
          for row in "${rows[@]}"; do
            IFS='|' read -r number name sha mode replacement <<< "$row"
            actual_json="$(gh api "$api/git/ref/heads/$name" 2>/dev/null || true)"
            actual="$(jq -r --arg ref "refs/heads/$name" 'if type=="object" and .ref==$ref then (.object.sha // "") else "" end' <<< "${actual_json:-null}" 2>/dev/null || true)"
            if [[ -n "$actual" ]]; then
              [[ "$actual" == "$sha" ]] || exit 1
              now_open="$(gh api "$api/pulls?state=open&per_page=100")"
              [[ "$(jq length <<< "$now_open")" -lt 100 ]] || exit 1
              if jq -e --arg b "$name" 'any(.[]; .head.ref==$b)' <<< "$now_open" >/dev/null; then exit 1; fi
              gh api -X DELETE "$api/git/refs/heads/$name" >/dev/null
            fi
            if gh api "$api/git/ref/heads/$name" >/dev/null 2>&1; then exit 1; fi
            echo "RETIRED #$number $name (tag preserved)"
          done
          echo "PASS: all 9 reviewed automation branches archived before removal; main untouched"
\t' read -r path old_blob; do
                git cat-file -e "HEAD:$path" || { echo "::error::Main missing $path"; exit 1; }
                if [[ "$mode" == reconciled ]]; then
                  [[ "$(git rev-parse "HEAD:$path")" == "$old_blob" ]] || { echo "::error::Unreconciled asset $path"; exit 1; }
                fi
              done < <(jq -r '.[] | [.filename,.sha] | @tsv' <<< "$files")
            fi
            if jq -e --arg b "$name" 'any(.[]; .head.ref==$b)' <<< "$open" >/dev/null; then
              echo "::error::Open PR still uses $name"; exit 1
            fi
            tag="archive/20261111/reviewed/pr-$number/$name"
            tagged="$(gh api "$api/git/ref/tags/$tag" --jq .object.sha 2>/dev/null || true)"
            [[ -z "$tagged" || "$tagged" == "$sha" ]] || { echo "::error::Conflicting archive $tag"; exit 1; }
            branchsha="$(gh api "$api/git/ref/heads/$name" --jq .object.sha 2>/dev/null || true)"
            [[ "$branchsha" == "$sha" || ( -z "$branchsha" && "$tagged" == "$sha" ) ]] || { echo "::error::Branch SHA mismatch $name"; exit 1; }
            echo "VERIFIED PR #$number $name"
          done
          # Create and verify ALL immutable recovery pointers first.
          for row in "${rows[@]}"; do
            IFS='|' read -r number name sha mode replacement <<< "$row"
            tag="archive/20261111/reviewed/pr-$number/$name"
            if ! gh api "$api/git/ref/tags/$tag" >/dev/null 2>&1; then
              gh api -X POST "$api/git/refs" -f ref="refs/tags/$tag" -f sha="$sha" >/dev/null
            fi
            [[ "$(gh api "$api/git/ref/tags/$tag" --jq .object.sha)" == "$sha" ]] || exit 1
          done
          # Exact-SHA lease and open-PR check immediately precede deletion.
          for row in "${rows[@]}"; do
            IFS='|' read -r number name sha mode replacement <<< "$row"
            actual="$(gh api "$api/git/ref/heads/$name" --jq .object.sha 2>/dev/null || true)"
            if [[ -n "$actual" ]]; then
              [[ "$actual" == "$sha" ]] || exit 1
              now_open="$(gh api "$api/pulls?state=open&per_page=100")"
              [[ "$(jq length <<< "$now_open")" -lt 100 ]] || exit 1
              if jq -e --arg b "$name" 'any(.[]; .head.ref==$b)' <<< "$now_open" >/dev/null; then exit 1; fi
              gh api -X DELETE "$api/git/refs/heads/$name" >/dev/null
            fi
            if gh api "$api/git/ref/heads/$name" >/dev/null 2>&1; then exit 1; fi
            echo "RETIRED #$number $name (tag preserved)"
          done
          echo "PASS: all 13 reviewed branches archived before removal; main untouched"

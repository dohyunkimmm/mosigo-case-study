name: PRD Evidence QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'downloads/mosigo_prd_delivery.html'
      - 'downloads/mosigo_business_plan_20261031.html'
      - 'qa/check-prd-trace.mjs'
      - 'qa/final-presentation-readability-20261108.py'
      - 'qa/focus-service-pm-decks-20261108.py'
      - '.github/workflows/prd-evidence-qa.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'downloads/mosigo_prd_delivery.html'
      - 'downloads/mosigo_business_plan_20261031.html'
      - 'qa/check-prd-trace.mjs'
      - 'qa/final-presentation-readability-20261108.py'
      - 'qa/focus-service-pm-decks-20261108.py'
      - '.github/workflows/prd-evidence-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prd-trace-and-product-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout PRD portfolio
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: site
          persist-credentials: false
      - name: Checkout pinned MOSIGO prototype source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: dohyunkimmm/mosigo
          ref: 978ef8bc2e00e772a5a5ddad87584bb97451e4cb
          path: app
          persist-credentials: false
      - name: Use project-required Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Validate PRD trace and UAT claims
        working-directory: site
        run: node qa/check-prd-trace.mjs
      - name: Run prototype unit and source QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/qa-artifacts
          printf 'app commit: ' | tee site/qa-artifacts/commit.txt
          git -C app rev-parse HEAD | tee -a site/qa-artifacts/commit.txt
          cd app
          npm test 2>&1 | tee ../site/qa-artifacts/node-tests.tap
          npm run audit:source 2>&1 | tee ../site/qa-artifacts/source-audit.log
      - name: Read-only live MOSIGO API smoke (no test data writes)
        shell: bash
        run: |
          set -euo pipefail
          cd app
          SMOKE_ATTEMPTS=3 SMOKE_RETRY_MS=3000 npm run smoke:production 2>&1 | tee ../site/qa-artifacts/live-smoke.log
      - name: Save QA logs (not customer UAT evidence)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mosigo-prd-product-qa
          path: site/qa-artifacts/
          if-no-files-found: ignore
          retention-days: 30

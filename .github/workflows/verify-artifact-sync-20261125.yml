name: Preserve superseded generated PR heads and retire verified refs
on:
  push:
    branches: [verify/artifact-sync-20261125]
permissions:
  contents: write
  pull-requests: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify closed PRs and exact replacement coverage before archival
        shell: bash
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY"
          replacement=$(gh api "$api/pulls/207")
          jq -e '.head.sha == "dd080b8f94156e751695bf15997a742cd644a8c7" and .base.ref == "main" and (.state == "open" or .merged == true)' <<< "$replacement" >/dev/null
          replacement_files=$(gh api "$api/pulls/207/files?per_page=100" --jq '.[].filename')
          for record in \
            '201|automation/mobile-previews-45525111789-1|5aaaf8444cb96e13b01f03495203b6ac5efe0700' \
            '202|automation/ppt-preview-45525111832-1|ca5f293b7f1d36b2ca07fcfe6fec745408c41476'; do
            IFS='|' read -r number branch sha <<< "$record"
            gh api "$api/pulls/$number" | jq -e --arg b "$branch" --arg s "$sha" --arg r "$GITHUB_REPOSITORY" '.state == "closed" and .merged == false and .head.ref == $b and .head.sha == $s and .head.repo.full_name == $r' >/dev/null
            while IFS= read -r file; do
              grep -Fxq "$file" <<< "$replacement_files"
            done < <(gh api "$api/pulls/$number/files?per_page=100" --jq '.[].filename')
            open=$(gh api "$api/pulls?state=open&per_page=100")
            jq -e --arg b "$branch" 'length < 100 and all(.[]; .head.ref != $b)' <<< "$open" >/dev/null
            current=$(gh api "$api/git/matching-refs/heads/$branch" | jq -r --arg r "refs/heads/$branch" '.[]|select(.ref==$r)|.object.sha')
            [[ -z "$current" || "$current" == "$sha" ]]
            tag="archive/closed/20261125/pr-$number/$branch"
            existing=$(gh api "$api/git/matching-refs/tags/$tag" | jq -r --arg r "refs/tags/$tag" '.[]|select(.ref==$r)|.object.sha')
            if [[ -z "$existing" ]]; then
              gh api -X POST "$api/git/refs" -f ref="refs/tags/$tag" -f sha="$sha" >/dev/null
            else
              [[ "$existing" == "$sha" ]]
            fi
            [[ "$(gh api "$api/git/ref/tags/$tag" --jq .object.sha)" == "$sha" ]]
            if [[ -n "$current" ]]; then
              [[ "$(gh api "$api/git/ref/heads/$branch" --jq .object.sha)" == "$sha" ]]
              gh api -X DELETE "$api/git/refs/heads/$branch"
            fi
            [[ -z "$(gh api "$api/git/matching-refs/heads/$branch" | jq -r --arg r "refs/heads/$branch" '.[]|select(.ref==$r)|.object.sha')" ]]
            echo "PASS archived PR #$number at $sha and retired $branch"
          done
      - name: Preserve this completed verification branch before retiring
        shell: bash
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY"
          branch="verify/artifact-sync-20261125"
          tag="archive/verification/20261125/$branch"
          [[ "$GITHUB_REF" == "refs/heads/$branch" ]]
          [[ "$(gh api "$api/git/ref/heads/$branch" --jq .object.sha)" == "$GITHUB_SHA" ]]
          existing=$(gh api "$api/git/matching-refs/tags/$tag" | jq -r --arg r "refs/tags/$tag" '.[]|select(.ref==$r)|.object.sha')
          if [[ -z "$existing" ]]; then
            gh api -X POST "$api/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" >/dev/null
          else
            [[ "$existing" == "$GITHUB_SHA" ]]
          fi
          [[ "$(gh api "$api/git/ref/tags/$tag" --jq .object.sha)" == "$GITHUB_SHA" ]]
          [[ "$(gh api "$api/git/ref/heads/$branch" --jq .object.sha)" == "$GITHUB_SHA" ]]
          gh api -X DELETE "$api/git/refs/heads/$branch"
          echo "PASS archived verification branch at $GITHUB_SHA"

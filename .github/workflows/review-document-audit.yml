name: Review published documents
on:
  push:
    branches: [review/document-audit-20261117]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Compare presentation files and published downloads
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils python3-pil
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from xml.etree import ElementTree as ET
          from urllib.request import urlopen
          from hashlib import sha256
          from subprocess import check_output
          import re, unicodedata
          root = Path('downloads')
          def norm(s):
              return ''.join(c for c in unicodedata.normalize('NFKC', s) if c.isalnum())
          pairs = [
              ('mosigo_business_plan.pptx', 'mosigo_business_plan_20261031.pdf'),
              ('mosigo_report.pptx','mosigo_report_preview.pdf'),
              ('MOSIGO_IR_Investment_Review_12slides.pptx','MOSIGO_IR_Investment_Review_12slides.pdf'),
          ]
          for ppt, pdf in pairs:
              pages = check_output(['pdftotext','-layout',str(root/pdf),'-']).decode().split('\f')[:-1]
              with ZipFile(root/ppt) as z:
                  assert z.testzip() is None
                  slides = sorted((f for f in z.namelist() if re.fullmatch(r'ppt/slides/slide\d+\.xml',f)), key=lambda f:int(re.search(r'(\d+)\.xml',f)[1]))
                  print(f'{ppt}: {len(slides)} slides; PDF: {len(pages)} pages',flush=True)
                  assert len(slides) == len(pages)
                  for i, (slide,page) in enumerate(zip(slides,pages),1):
                      runs = [x.text or '' for x in ET.fromstring(z.read(slide)).iter() if x.tag.endswith('}t')]
                      targets = [norm(x) for x in runs if len(norm(x)) >= 5]
                      whole = norm(page)
                      missing = [x for x in targets if x not in whole]
                      print(f'{i:02}: {len(targets)-len(missing)}/{len(targets)} matched; unmatched: {missing}',flush=True)
          from PIL import Image, ImageChops, ImageStat
          from io import BytesIO
          from tempfile import TemporaryDirectory
          with TemporaryDirectory() as tmp, ZipFile(root/'mosigo_business_plan.pptx') as z:
              check_output(['pdftoppm','-r','72','-png',str(root/'mosigo_business_plan_20261031.pdf'),tmp+'/plan'])
              renders = sorted(Path(tmp).glob('plan-*.png'))
              assert len(renders) == 19
              for i, render in enumerate(renders,1):
                  rels = ET.fromstring(z.read(f'ppt/slides/_rels/slide{i}.xml.rels'))
                  imgs = [x.get('Target') for x in rels if x.get('Type','').endswith('/image')]
                  assert len(imgs) == 1, (i,imgs)
                  embedded = Image.open(BytesIO(z.read('ppt/'+imgs[0].removeprefix('../')))).convert('RGB')
                  pdf = Image.open(render).convert('RGB')
                  diff = ImageChops.difference(embedded.resize((320,180)),pdf.resize((320,180)))
                  mae = sum(ImageStat.Stat(diff).mean)/3
                  print(f'Plan page {i:02}: embedded {embedded.size}, PDF {pdf.size}; RGB mean difference {mae:.2f}/255',flush=True)
                  assert mae < 12, (i,mae)
          for file in sorted(root.iterdir()):
              if not file.is_file():
                  continue
              try:
                  with urlopen('https://mosigo-case-study.vercel.app/downloads/'+file.name,timeout=30) as response:
                      body=response.read()
                      print(f'Live {file.name}: {response.status}, {len(body)} bytes, SHA256 match: {sha256(body).digest()==sha256(file.read_bytes()).digest()}',flush=True)
              except Exception as error:
                  print(f'Live {file.name}: {error}',flush=True)
          PY

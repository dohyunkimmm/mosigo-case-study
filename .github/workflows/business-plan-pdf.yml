name: Build business plan PDF

on:
  push:
    branches: [main, 'review/p0-p1-p2-*']
    paths:
      - 'downloads/mosigo_business_plan_20261031.html'
      - 'qa/generate-business-plan.mjs'
      - '.github/workflows/business-plan-pdf.yml'
  pull_request:
    branches: [main, 'review/p0-p1-p2-*']
    paths:
      - 'downloads/mosigo_business_plan_20261031.html'
      - 'qa/generate-business-plan.mjs'
      - '.github/workflows/business-plan-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mosigo-business-plan-pdf-fast
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install PDF renderer
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.1
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version
      - name: Install original Pretendard fonts
        run: |
          set -euo pipefail
          mkdir -p qa-fonts
          curl -fSL --retry 3 https://raw.githubusercontent.com/orioncactus/pretendard/main/packages/pretendard/dist/public/static/Pretendard-Regular.otf -o qa-fonts/Pretendard-Regular.otf
          curl -fSL --retry 3 https://raw.githubusercontent.com/orioncactus/pretendard/main/packages/pretendard/dist/public/static/Pretendard-Bold.otf -o qa-fonts/Pretendard-Bold.otf
          test "$(stat -c%s qa-fonts/Pretendard-Regular.otf)" -gt 1000000
          test "$(stat -c%s qa-fonts/Pretendard-Bold.otf)" -gt 1000000
      - name: Rebuild business plan PDF and check its pages
        run: |
          set -euo pipefail
          node qa/generate-business-plan.mjs
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils webp
          test "$(pdfinfo downloads/mosigo_business_plan_20261031.pdf | awk '/^Pages:/ {print $2}')" = "17"
          pdffonts downloads/mosigo_business_plan_20261031.pdf | grep -qi Pretendard
          pdftotext downloads/mosigo_business_plan_20261031.pdf /tmp/business-plan-text.txt
          if grep -Eq '고객 설정로|산정 기준한|검토 방향로' /tmp/business-plan-text.txt; then
            echo "::error::Business plan contains an unreviewed Korean phrase"
            exit 1
          fi
          if grep -E '2026\.10\.31|2026\.10\.07|BUSINESS PLAN 2026' /tmp/business-plan-text.txt; then
            echo "::error::Document publication date remains in the rendered PDF"
            exit 1
          fi
      - name: Render 17 mobile PDF preview pages
        run: |
          set -euo pipefail
          mkdir -p downloads/previews /tmp/mosigo-plan-preview
          test "$(pdfinfo downloads/mosigo_business_plan_20261031.pdf | awk '/^Pages:/ {print $2}')" = "17"
          for page in $(seq 1 17); do
            padded="$(printf '%02d' "$page")"
            pdftoppm -f "$page" -l "$page" -scale-to 1400 -png -singlefile downloads/mosigo_business_plan_20261031.pdf /tmp/mosigo-plan-preview/page
            cwebp -quiet -q 84 -m 6 /tmp/mosigo-plan-preview/page.png -o "downloads/previews/plan-$padded.webp"
            cwebp -quiet -q 82 -m 6 -resize 800 0 /tmp/mosigo-plan-preview/page.png -o "downloads/previews/plan-$padded-sm.webp"
            test "$(stat -c%s "downloads/previews/plan-$padded.webp")" -gt 1000
            test "$(stat -c%s "downloads/previews/plan-$padded-sm.webp")" -gt 1000
          done
          test "$(find downloads/previews -maxdepth 1 -name 'plan-*.webp' | wc -l)" -eq 34
      - name: Publish regenerated PDF
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/mosigo_business_plan_20261031.pdf downloads/previews/plan-*.webp
          if git diff --cached --quiet; then
            echo "PDF is already up to date"
          else
            git commit -m "docs: regenerate business plan without dates"
            git pull --rebase origin main
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Save document for inspection
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mosigo-business-plan-pdf
          path: |
            downloads/mosigo_business_plan_20261031.pdf
            downloads/previews/plan-*.webp
          if-no-files-found: ignore
          retention-days: 14

name: Generate new MOSIGO business plan PDF
on:
  push:
    branches:
      - 'business-plan/new-20261031'
    paths:
      - 'downloads/mosigo_business_plan_20261031.html'
      - 'qa/generate-business-plan.mjs'
      - '.github/workflows/business-plan-pdf.yml'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Korean font and PDF inspector
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk poppler-utils
      - name: Install browser renderer
        run: |
          npm install --no-save --ignore-scripts --no-package-lock playwright@1.64.1
          npx playwright install chromium
      - name: Generate and verify standalone PDF
        run: |
          node qa/generate-business-plan.mjs
          pdfinfo downloads/mosigo_business_plan_20261031.pdf | grep -E 'Pages:|Page size:|File size:'
          test "$(pdfinfo downloads/mosigo_business_plan_20261031.pdf | awk '/^Pages:/ {print $2}')" = "17"
          pdftotext downloads/mosigo_business_plan_20261031.pdf /tmp/mosigo_plan.txt
          grep -q 'MOSIGO' /tmp/mosigo_plan.txt
          grep -q 'BEP' /tmp/mosigo_plan.txt
      - name: Commit rendered PDF to branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/mosigo_business_plan_20261031.pdf
          git commit -m 'docs: add newly authored 2026 MOSIGO business plan PDF'
          git push origin HEAD:refs/heads/business-plan/new-20261031

name: Apply MOSIGO editorial review assets (one-time)
on:
  push:
    branches: ['review/editorial-dedup-risk-20261108']
    paths:
      - 'qa/apply-editorial-review-20261108.py'
      - '.github/workflows/apply-editorial-review-20261108.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install document tooling
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-impress poppler-utils webp fonts-nanum fonts-noto-cjk python3-venv
          python3 -m venv /tmp/mosigo-editorial-venv
          /tmp/mosigo-editorial-venv/bin/pip install --quiet python-pptx==1.0.2
          mkdir -p ~/.local/share/fonts/mosigo qa-fonts
          curl -fSL --retry 3 https://raw.githubusercontent.com/orioncactus/pretendard/main/packages/pretendard/dist/public/static/Pretendard-Regular.otf -o qa-fonts/Pretendard-Regular.otf
          curl -fSL --retry 3 https://raw.githubusercontent.com/orioncactus/pretendard/main/packages/pretendard/dist/public/static/Pretendard-Bold.otf -o qa-fonts/Pretendard-Bold.otf
          cp qa-fonts/*.otf ~/.local/share/fonts/mosigo/
          fc-cache -f
          fc-match Pretendard | grep -qi Pretendard
      - name: Apply reviewed editorial copy
        run: /tmp/mosigo-editorial-venv/bin/python qa/apply-editorial-review-20261108.py
      - name: Rebuild business plan PDF with layout check
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.1
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          CHROME_BIN="$CHROME_BIN" node qa/generate-business-plan.mjs
          test "$(pdfinfo downloads/mosigo_business_plan_20261031.pdf | awk '/^Pages:/ {print $2}')" = "19"
      - name: Export editable slide decks
        run: |
          set -euo pipefail
          mkdir -p /tmp/mosigo-pdf
          for stem in mosigo_report MOSIGO_IR_Investment_Review_12slides; do
            libreoffice -env:UserInstallation=file:///tmp/lo-editorial-20261108 --headless --convert-to pdf --outdir /tmp/mosigo-pdf "downloads/$stem.pptx"
          done
          cp /tmp/mosigo-pdf/mosigo_report.pdf downloads/mosigo_report_preview.pdf
          cp /tmp/mosigo-pdf/MOSIGO_IR_Investment_Review_12slides.pdf downloads/
          test "$(pdfinfo downloads/mosigo_report_preview.pdf | awk '/^Pages:/ {print $2}')" = "11"
          test "$(pdfinfo downloads/MOSIGO_IR_Investment_Review_12slides.pdf | awk '/^Pages:/ {print $2}')" = "12"
          pdffonts downloads/mosigo_report_preview.pdf | grep -qi Pretendard
          pdffonts downloads/MOSIGO_IR_Investment_Review_12slides.pdf | grep -qi Pretendard
      - name: Regenerate all 42 full and small document previews
        run: |
          set -euo pipefail
          mkdir -p downloads/previews /tmp/mosigo-preview
          for entry in "plan:19:mosigo_business_plan_20261031.pdf" "slides:11:mosigo_report_preview.pdf" "ir:12:MOSIGO_IR_Investment_Review_12slides.pdf"; do
            IFS=: read -r kind total doc <<< "$entry"
            for page in $(seq 1 "$total"); do
              n="$(printf '%02d' "$page")"
              pdftoppm -f "$page" -l "$page" -scale-to 1400 -png -singlefile "downloads/$doc" /tmp/mosigo-preview/page
              cwebp -quiet -q 84 -m 6 /tmp/mosigo-preview/page.png -o "downloads/previews/$kind-$n.webp"
              cwebp -quiet -q 82 -m 6 -resize 800 0 /tmp/mosigo-preview/page.png -o "downloads/previews/$kind-$n-sm.webp"
            done
            test "$(find downloads/previews -name "$kind-*.webp" | wc -l)" -eq "$((total * 2))"
          done
      - name: Verify financial assumptions and reviewed language
        run: |
          set -euo pipefail
          pdftotext downloads/mosigo_report_preview.pdf /tmp/mosigo-product.txt
          pdftotext downloads/MOSIGO_IR_Investment_Review_12slides.pdf /tmp/mosigo-ir.txt
          pdftotext downloads/mosigo_business_plan_20261031.pdf /tmp/mosigo-plan.txt
          grep -q '제품기획 산출물과 후속 검증' /tmp/mosigo-product.txt
          grep -q '투자 승인 조건' /tmp/mosigo-ir.txt
          grep -q '민감도 분석과 개선 우선순위' /tmp/mosigo-plan.txt
          grep -q '1,082' /tmp/mosigo-ir.txt
          grep -q '3,700' /tmp/mosigo-ir.txt
          grep -q '154만' /tmp/mosigo-plan.txt
      - name: Commit reviewed site and document assets to review branch
        env:
          BRANCH: review/editorial-dedup-risk-20261108
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html \
            downloads/mosigo_business_plan_20261031.html \
            downloads/mosigo_business_plan_20261031.pdf \
            downloads/mosigo_report.pptx \
            downloads/mosigo_report_preview.pdf \
            downloads/MOSIGO_IR_Investment_Review_12slides.pptx \
            downloads/MOSIGO_IR_Investment_Review_12slides.pdf \
            downloads/previews/
          if ! git diff --cached --quiet; then
            git commit -m "docs: apply concise wording and regenerate all MOSIGO documents"
            git push origin "HEAD:$BRANCH"
          fi

name: Site QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'favicon.svg'
      - 'assets/**'
      - 'decision-memos.html'
      - 'forecast.html'
      - 'materials.html'
      - 'downloads/**'
      - 'qa/**'
      - '.github/workflows/site-qa.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1' # Monday 09:00 Asia/Seoul

permissions:
  contents: read

concurrency:
  group: mosigo-site-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-and-lighthouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify Vercel ignore-build behavior
        run: bash qa/test-vercel-ignore-build.sh
      # GitHub's Azure Ubuntu mirror had repeated DNS failures on 2026-11-11.
      # Keep the same dependencies and QA thresholds; change only mirror routing.
      - name: Use official Ubuntu mirrors when Azure mirror DNS is unavailable
        run: |
          set -euo pipefail
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\n' | sudo tee /etc/apt/apt-mirrors.txt
          fi
          printf '%s\n' 'Acquire::Retries "1";' 'Acquire::http::Timeout "20";' 'Acquire::https::Timeout "20";' | sudo tee /etc/apt/apt.conf.d/99mosigo-ci-network
      - name: Install browser and Lighthouse
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.1 lighthouse@13.6.0 puppeteer-core@25.16.0
          # GitHub-hosted Ubuntu already includes Chrome runtime libraries; avoid flaky apt mirrors.
          # Still download and run the pinned Playwright Chromium browser for every QA check.
          npx --no-install playwright install chromium
      - name: Test exact repository build
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/mosigo-qa-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          node qa/smoke.mjs
          node qa/v3.mjs
          node qa/prd-browser.mjs
          export CHROME_PATH="$(node -p "require('playwright').chromium.executablePath()")"
          npx --no-install lighthouse http://127.0.0.1:8765/ --only-categories=performance,accessibility,best-practices,seo --form-factor=mobile --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --output=json --output-path=qa-artifacts/lighthouse-mobile.json --quiet
          npx --no-install lighthouse http://127.0.0.1:8765/ --only-categories=performance,accessibility,best-practices,seo --preset=desktop --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --output=json --output-path=qa-artifacts/lighthouse-desktop.json --quiet
          node qa/check-lighthouse.mjs
      - name: Wait for the exact production HTML
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          url="https://mosigo-case-study.vercel.app/"
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --location --compressed --max-time 20 "$url" -o /tmp/mosigo-live-index.html && cmp -s index.html /tmp/mosigo-live-index.html; then
              echo "Production HTML matches this commit (attempt $attempt)"
              exit 0
            fi
            echo "Production has not served this commit yet (attempt $attempt/18)"
            sleep 10
          done
          echo "::error::Production HTML did not match the repository version"
          exit 1
      - name: Test deployed site and synthetic Lighthouse
        if: github.event_name != 'pull_request'
        env:
          SITE_QA_URL: https://mosigo-case-study.vercel.app/
          SITE_QA_MODE: live
        run: |
          node qa/smoke.mjs
          node qa/v3.mjs
          node qa/prd-browser.mjs
          export CHROME_PATH="$(node -p "require('playwright').chromium.executablePath()")"
          npx --no-install lighthouse "$SITE_QA_URL" --only-categories=performance,accessibility,best-practices,seo --form-factor=mobile --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --output=json --output-path=qa-artifacts/live-lighthouse-mobile.json --quiet
          npx --no-install lighthouse "$SITE_QA_URL" --only-categories=performance,accessibility,best-practices,seo --preset=desktop --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --output=json --output-path=qa-artifacts/live-lighthouse-desktop.json --quiet
          node qa/check-lighthouse.mjs
      - name: Verify integrated Excel sheets, unchanged original formulas and Pretendard
        run: python3 qa/strategy_excel_sync.py mosigo
      - name: Verify read-only GitHub source access
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Checkout disables persisted git credentials. Use the scoped
          # workflow token for a read-only binary consistency check.
          curl --fail --silent --show-error --location --retry 3 --max-time 30 \
            -H "Authorization: Bearer ${GH_READ_TOKEN}" \
            -H "Accept: application/vnd.github.raw+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/contents/downloads/mosigo_model.xlsx?ref=main" \
            -o /tmp/mosigo-private-source-check.xlsx
          cmp -s downloads/mosigo_model.xlsx /tmp/mosigo-private-source-check.xlsx
          echo "PASS read-only GitHub binary retrieval"
      # Generator jobs can publish newer main assets after the workflow starts.
      - name: Confirm live Excel, PDF and PPTX match latest generated main branch assets
        if: github.event_name != 'pull_request'
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for path in \
            downloads/mosigo_model.xlsx \
            downloads/mosigo_business_plan_20261031.pdf \
            downloads/mosigo_report.pptx \
            downloads/mosigo_report_preview.pdf \
            downloads/MOSIGO_IR_Investment_Review_12slides.pptx \
            downloads/MOSIGO_IR_Investment_Review_12slides.pdf; do
            ok=0
            for attempt in $(seq 1 18); do
              # Compare Git blob object IDs, not raw downloads from the
              # Contents API: binary raw responses may be inconsistent for
              # Office artifacts while the repository SHA remains authoritative.
              source_sha="$(curl --fail --silent --show-error --location --retry 3 --max-time 30 \
                -H "Authorization: Bearer ${GH_READ_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/contents/${path}?ref=main" \
                | jq -er '.sha | select(test("^[0-9a-f]{40}$"))')"
              if curl --fail --silent --show-error --location --max-time 25 \
                -H 'Cache-Control: no-cache' \
                "https://mosigo-case-study.vercel.app/$path?qa=${GITHUB_SHA}-${attempt}" -o /tmp/mosigo-live-asset; then
                live_sha="$(git hash-object /tmp/mosigo-live-asset)"
                if [ "$source_sha" = "$live_sha" ]; then
                  echo "PASS Git blob identical $path (attempt $attempt)"
                  ok=1
                  break
                fi
              fi
              sleep 5
            done
            if [ "$ok" -ne 1 ]; then
              echo "::error::Live site binary is not identical: $path"
              exit 1
            fi
          done
      - name: Install Poppler PDF utilities from conda-forge
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/mosigo-poppler"
          /usr/share/miniconda/bin/conda create --yes --prefix "$prefix" --override-channels --channel conda-forge 'poppler=26.09.0'
          "$prefix/bin/pdfinfo" -v
          "$prefix/bin/pdftotext" -v
          echo "$prefix/bin" >> "$GITHUB_PATH"
      - name: Extract final document text for editorial QA
        run: |
          command -v pdfinfo && command -v pdftotext
          python3 -m venv /tmp/mosigo-editorial-venv
          /tmp/mosigo-editorial-venv/bin/pip install --quiet python-pptx openpyxl
          /tmp/mosigo-editorial-venv/bin/python qa/extract-editorial-text.py
      - name: Verify PDF, PPTX, embedded fonts and color contrast
        run: |
          command -v pdfinfo && command -v pdftotext
          python3 qa/check-document-design.py
      - name: Save QA reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mosigo-site-qa
          path: qa-artifacts/
          if-no-files-found: ignore
          retention-days: 14

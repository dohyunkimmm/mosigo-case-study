name: Mobile Safari engine and font QA

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'qa/mobile-browser.mjs'
      - '.github/workflows/mobile-browser-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mosigo-mobile-browser-main
  cancel-in-progress: true

jobs:
  mobile-engines:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install browser engines
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.1
          npx --no-install playwright install --with-deps chromium webkit
      - name: Exercise production PDFs and emoji font on WebKit/Chromium
        env:
          SITE_QA_URL: https://mosigo-case-study.vercel.app/
        run: node qa/mobile-browser.mjs
      - name: Save device-emulation screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mosigo-webkit-mobile-evidence
          path: qa-artifacts/mobile-browser/
          if-no-files-found: ignore
          retention-days: 14

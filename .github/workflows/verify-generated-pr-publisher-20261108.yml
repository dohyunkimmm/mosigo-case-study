# One-time non-deployable smoke test of bot-generated PR permissions and publishing.
name: Verify bot-generated PR publishing (one-time)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-generated-pr-publisher-20261108.yml'

permissions:
  contents: write
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Create, verify, close, archive and retire a non-deployable generated PR
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || exit 1
          api="repos/${GITHUB_REPOSITORY}"
          branch="automation/review-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fixture="qa/automation-pr-smoke-20261108.txt"
          expected=''
          cleanup() {
            set +e
            prs="$(gh api "$api/pulls?state=open&per_page=100" 2>/dev/null)"
            number="$(jq -r --arg b "$branch" '[.[] | select(.head.ref==$b and .head.repo.full_name==env.GITHUB_REPOSITORY)] | if length==1 then .[0].number else empty end' <<< "$prs" 2>/dev/null)"
            if [[ "$number" =~ ^[0-9]+$ ]]; then
              gh api -X PATCH "$api/pulls/$number" -f state=closed >/dev/null || true
            fi
            actual="$(gh api "$api/git/ref/heads/$branch" --jq .object.sha 2>/dev/null)"
            if [[ "$actual" =~ ^[0-9a-f]{40}$ && "$actual" == "$expected" ]]; then
              tag="archive/verification/${GITHUB_RUN_ID}/review-smoke"
              gh api -X POST "$api/git/refs" -f ref="refs/tags/$tag" -f sha="$actual" >/dev/null
              if [[ "$(gh api "$api/git/ref/tags/$tag" --jq .object.sha 2>/dev/null)" == "$actual" ]]; then
                gh api -X DELETE "$api/git/refs/heads/$branch" >/dev/null
              fi
            fi
          }
          trap cleanup EXIT
          printf 'One-time trusted bot PR permission check; excluded from deployed website.\n' > "$fixture"
          bash .github/scripts/publish-generated-pr.sh review-smoke 'test: verify generated PR publishing' "$fixture"
          expected="$(git rev-parse HEAD)"
          prs="$(gh api "$api/pulls?state=open&per_page=100")"
          jq -e --arg b "$branch" --arg sha "$expected" --arg repo "$GITHUB_REPOSITORY" '
            [.[] | select(.head.ref==$b and .head.sha==$sha and .head.repo.full_name==$repo)] | length==1
          ' <<< "$prs" >/dev/null || exit 1
          echo "PASS bot-created PR opened with exact trusted branch and content"

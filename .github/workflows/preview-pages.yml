name: Build mobile document previews

on:
  push:
    branches: [main]
    paths:
      - 'downloads/mosigo_business_plan_20261031.pdf'
      - 'downloads/mosigo_report_preview.pdf'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: mosigo-mobile-preview-images
  cancel-in-progress: false

jobs:
  render-pages:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Install PDF rasterizer and WebP encoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils webp
      - name: Render every PDF page for mobile Safari
        run: |
          set -euo pipefail
          mkdir -p downloads/previews /tmp/mosigo-mobile-preview
          for kind in plan slides; do
            if [ "$kind" = plan ]; then
              pdf=downloads/mosigo_business_plan_20261031.pdf
              expected=19
            else
              pdf=downloads/mosigo_report_preview.pdf
              expected=11
            fi
            pages="$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')"
            test "$pages" = "$expected"
            rm -f "downloads/previews/$kind"-*.webp
            for number in $(seq 1 "$pages"); do
              padded="$(printf '%02d' "$number")"
              pdftoppm -f "$number" -l "$number" -scale-to 1400 -png -singlefile "$pdf" /tmp/mosigo-mobile-preview/page
              cwebp -quiet -q 84 -m 6 /tmp/mosigo-mobile-preview/page.png -o "downloads/previews/$kind-$padded.webp"
              cwebp -quiet -q 82 -m 6 -resize 800 0 /tmp/mosigo-mobile-preview/page.png -o "downloads/previews/$kind-$padded-sm.webp"
              test "$(stat -c%s "downloads/previews/$kind-$padded.webp")" -gt 1000
              test "$(stat -c%s "downloads/previews/$kind-$padded-sm.webp")" -gt 1000
            done
            test "$(find downloads/previews -maxdepth 1 -name "$kind-*.webp" | wc -l)" -eq "$((expected * 2))"
            echo "PASS $kind $pages accessible mobile preview pages"
          done
      - name: Open PR for regenerated mobile-previews assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/publish-generated-pr.sh mobile-previews 'assets: refresh mobile PDF preview images' downloads/previews/plan-*.webp downloads/previews/slides-*.webp
      - name: Save preview images
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mosigo-mobile-preview-pages
          path: downloads/previews/
          if-no-files-found: error
          retention-days: 14
